<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .success {
            color: #198754;
            font-size: 20px;
            font-weight: bold;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        .google {
            margin-top: 20px;
            padding: 12px 20px;
            background: #4285F4;
            color: white;
            border-radius: 6px;
            display: inline-block;
        }
    </style>


</head>

<body>

<div class="container">

    <h1>Welcome Home 👋</h1>

    <p class="success">
        Successfully Logged In with Google!
    </p>

    <p>
        Your Google OAuth2 authentication was successful.
    </p>

    <div class="google">
        Google OAuth2
    </div>


</div>

</body>
</html>
